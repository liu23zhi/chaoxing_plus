name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows 6.2.0 类型检查、构建与全量测试
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CXPLUS_NO_LOG_FILE: '1'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建扩展包
        run: npm run build

      - name: 构建 Windows 注入资源（release 关闭调试日志）
        run: npm run build:windows -- --release

      - name: 构建原生宿主与编译测试
        run: npm run build:native

      - name: 导出原生编译测试路径
        shell: pwsh
        run: |
          $bin = (Resolve-Path '.\windows\native-build\bin').Path
          $executables = [ordered]@{
            CX_NATIVE_HOST_EXE = 'chaoxing_plus.exe'
            CX_NATIVE_INJECTION_EXE = 'injection-tests.exe'
            CX_NATIVE_ASSETS_EXE = 'assets-tests.exe'
            CX_NATIVE_OPTIONS_EXE = 'options-tests.exe'
            CX_NATIVE_SESSION_EXE = 'session-tests.exe'
            CX_NATIVE_SELECTION_EXE = 'selection-tests.exe'
            CX_NATIVE_TRANSPORT_EXE = 'transport-tests.exe'
            CX_NATIVE_AUDIT_EXE = 'audit-tests.exe'
            CX_NATIVE_CONFIG_EXE = 'config-store-tests.exe'
            CX_NATIVE_CACHE_EXE = 'discovery-cache-driver.exe'
            CX_NATIVE_CACHE_HOST_EXE = 'discovery-cache-host-tests.exe'
            CX_NATIVE_CLI_SELECTION_EXE = 'cli-selection-tests.exe'
            CX_NATIVE_ELEVATION_EXE = 'elevation-tests.exe'
            CX_NATIVE_ELEVATION_HOST_EXE = 'elevation-host-tests.exe'
            CX_NATIVE_DPI_EXE = 'dpi-tests.exe'
            CX_NATIVE_DPI_PROCESS_EXE = 'dpi-process-tests.exe'
            CX_NATIVE_DPI_CHILD_EXE = 'dpi-child.exe'
            CX_NATIVE_PROCESS_CHECK_EXE = 'process-check-tests.exe'
            CX_NATIVE_PROCESS_FIXTURE_EXE = 'process-fixture.exe'
            CX_NATIVE_DIAGNOSTICS_EXE = 'diagnostics-tests.exe'
            CX_NATIVE_HOME_EXE = 'home-tests.exe'
            CX_NATIVE_ADAPTER_EXE = 'adapter-account-tests.exe'
            CX_NATIVE_ACCOUNT_WINDOW_EXE = 'account-window-tests.exe'
            CX_NATIVE_BROWSER_SESSION_EXE = 'browser-session-tests.exe'
            CX_NATIVE_MULTI_HOST_EXE = 'multi-file\chaoxing_plus.exe'
            CX_NATIVE_CONSOLE_HELPER_EXE = 'multi-file\chaoxing_plus.com'
            CX_NATIVE_PACKAGE_LAUNCHER_EXE = 'multi-file\package-to-single\chaoxing_plus.exe'
            CX_NATIVE_MULTI_ASSETS_EXE = 'multi-assets-tests.exe'
            CX_NATIVE_CONSOLE_HELPER_FIXTURE_EXE = 'console-helper-fixture.exe'
          }
          foreach ($entry in $executables.GetEnumerator()) {
            $path = Join-Path $bin $entry.Value
            if (-not (Test-Path -LiteralPath $path)) { throw "缺少原生编译测试产物: $path" }
            "$($entry.Key)=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: 单元测试（含原生编译入口）
        shell: pwsh
        run: |
          $testFiles = @(Get-ChildItem -LiteralPath scripts -Filter '*.test.mjs' -File | Sort-Object Name | Select-Object -ExpandProperty FullName)
          Write-Host "单元测试文件数: $($testFiles.Count)"
          # 受限并发：默认按 CPU 并发会同时启动多个 Chromium/原生宿主用例，在 CI 小规格 runner 上出现过截止类偶发。
          node --test --test-concurrency=4 --test-timeout=300000 @testFiles

      - name: 浏览器回归（含原生构建浏览器入口）
        shell: pwsh
        run: |
          $browserFiles = @(Get-ChildItem -LiteralPath scripts -Filter '*.browser.mjs' -File | Sort-Object Name | Select-Object -ExpandProperty FullName)
          Write-Host "浏览器测试文件数: $($browserFiles.Count)"
          node --test --test-concurrency=4 --test-timeout=600000 @browserFiles

      - name: 发布包冒烟
        shell: pwsh
        run: npm run release:windows

      - name: 发布包解压入口自检
        shell: pwsh
        run: |
          $build = (Resolve-Path 'windows/native-build').Path
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $unpacked = Join-Path $build 'release-ci'
          Expand-Archive -LiteralPath (Join-Path $build "chaoxing-plus-$version-windows.zip") -DestinationPath $unpacked -Force
          $package = Join-Path $unpacked 'release'
          node (Join-Path $package 'verify-release.mjs')
          if ($LASTEXITCODE -ne 0) { throw "发布包完整性自校验失败: $LASTEXITCODE" }
          # 原生发布直接落在 native-build/release，只提供两个变体。
          foreach ($required in @('release-info.json', 'SHA256SUMS.txt', 'verify-release.mjs', 'single-file\chaoxing_plus.exe', 'multi-file\start-windows.cmd', 'multi-file\windows\share-file\config.example.json', 'multi-file\chaoxing_plus.exe', 'multi-file\chaoxing_plus.com', 'multi-file\assets\windows-bootstrap.js', 'multi-file\assets\chaoxing-plus.windows.js', 'multi-file\assets\trampoline.js', 'multi-file\assets\vendor\sweetalert2.min.css', 'multi-file\winmm-proxy.dll', 'multi-file\package-to-single\chaoxing_plus.exe', 'multi-file\release-info.json', 'multi-file\SHA256SUMS.txt', 'multi-file\verify-release.mjs')) {
            if (-not (Test-Path -LiteralPath (Join-Path $package $required))) { throw "发布包缺少: $required" }
          }
          foreach ($forbidden in @('chaoxing_plus.exe', 'start-windows.cmd', 'windows\node-source\main.mjs', 'start-windows-node.cmd', 'runtime\node.exe')) {
            if (Test-Path -LiteralPath (Join-Path $package $forbidden)) { throw "原生发布包不应包含 Node 产物: $forbidden" }
          }
          $native = Start-Process -FilePath (Join-Path $package 'single-file\chaoxing_plus.exe') -ArgumentList '--self-check','--quiet','--no-disk-write' -PassThru -Wait
          if ($native.ExitCode -ne 0) { throw "发布包原生自检失败: $($native.ExitCode)" }
          node (Join-Path $package 'multi-file\verify-release.mjs')
          if ($LASTEXITCODE -ne 0) { throw "multi-file 变体完整性自校验失败: $LASTEXITCODE" }
          $multi = Start-Process -FilePath (Join-Path $package 'multi-file\chaoxing_plus.exe') -ArgumentList '--self-check','--quiet','--no-disk-write' -PassThru -Wait
          if ($multi.ExitCode -ne 0) { throw "multi-file 原生自检失败: $($multi.ExitCode)" }
          Push-Location -LiteralPath (Join-Path $package 'multi-file')
          try {
            $resolved = @(Get-Command .\chaoxing_plus -CommandType Application)[0].Source
            if ([IO.Path]::GetExtension($resolved) -ne '.com') { throw "扩展名省略入口未选择 .com: $resolved" }
            .\chaoxing_plus --self-check --quiet --no-disk-write
            if ($LASTEXITCODE -ne 0) { throw "Console 辅助入口自检失败: $LASTEXITCODE" }
          } finally { Pop-Location }
          $wrapper = Start-Process -FilePath (Join-Path $package 'multi-file\package-to-single\chaoxing_plus.exe') -ArgumentList '--self-check','--quiet','--no-disk-write' -PassThru -Wait
          if ($wrapper.ExitCode -ne 0) { throw "多文件单 EXE 包装器自检失败: $($wrapper.ExitCode)" }

      - name: 上传发布包
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: windows/native-build/*.zip
          if-no-files-found: error

