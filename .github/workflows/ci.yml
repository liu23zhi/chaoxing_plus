name: 持续集成

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Ubuntu 类型检查与扩展构建
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: Linux 扩展构建
        run: npm run build

  windows-build:
    name: Windows 构建共享测试产物
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建扩展包
        run: npm run build
      - name: 构建 Windows 注入资源
        run: npm run build:windows -- --release
      - name: 构建原生宿主与编译测试
        run: npm run build:native
      - name: 校验构建产物
        shell: pwsh
        run: |
          $required = @(
            'dist/manifest.json',
            'dist/chaoxing-plus.js',
            'dist/_locales/zh_CN/messages.json',
            'dist-windows/windows-bootstrap.js',
            'dist-windows/chaoxing-plus.windows.js',
            'windows/native-build/bin/chaoxing_plus.exe',
            'windows/native-build/bin/account-window-tests.exe',
            'windows/native-build/bin/browser-session-tests.exe'
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "构建产物缺失: $path" }
          }
      - name: 上传共享 Windows 测试产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-ci-build-${{ github.sha }}
          path: |
            dist/
            dist-windows/
            windows/native-build/
          if-no-files-found: error
          retention-days: 7

  windows-real-client-discovery:
    name: 发现真实客户端注入矩阵
    permissions:
      contents: read
    needs: windows-build
    if: ${{ needs.windows-build.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 扫描客户端与数据库变量
        id: discover
        shell: pwsh
        env:
          REPOSITORY_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          $clientDirectory = Join-Path $env:GITHUB_WORKSPACE 'tests/private-clients'
          if (-not (Test-Path -LiteralPath $clientDirectory -PathType Container)) {
            throw "私有客户端目录不存在: $clientDirectory"
          }
          # Only the exam client fixtures belong to the matrix. The same directory also carries the
          # bundled input-method installer (wechat-ime-v*.exe), which has no client version to parse.
          $clientFiles = @(Get-ChildItem -LiteralPath $clientDirectory -Filter 'chaoxing-exam-*.exe' -File -Recurse | Sort-Object FullName)
          if ($clientFiles.Count -eq 0) { throw '私有客户端目录中没有 chaoxing-exam-*.exe' }

          $repositoryVars = $env:REPOSITORY_VARS_JSON | ConvertFrom-Json
          # Collect explicitly: a bare `$databaseVars = foreach (...) { Write-Output ...; $object }`
          # would swallow the ::add-mask:: workflow command into the variable and emit matrix rows
          # with an empty database name.
          $databaseVars = @()
          foreach ($property in $repositoryVars.PSObject.Properties) {
            $match = [regex]::Match([string]$property.Name, '^Examination_Client_Database_(.+)$', [Text.RegularExpressions.RegexOptions]::IgnoreCase)
            $value = [string]$property.Value
            if ($match.Success -and -not [string]::IsNullOrWhiteSpace($value)) {
              $compactValue = $value -replace '\s', ''
              if ($compactValue -ceq 'enabled') {
                throw "变量 $($property.Name) 仍是旧的 enabled 标记；请把 UserExamInfo.db 的 Base64 文本写入该变量"
              }
              Write-Output "::add-mask::$compactValue"
              $databaseVars += [pscustomobject]@{ Name = [string]$property.Name; Suffix = $match.Groups[1].Value }
            }
          }
          if ($databaseVars.Count -eq 0) { throw '没有配置非空的 Examination_Client_Database_* Base64 变量' }

          $entries = foreach ($clientFile in $clientFiles) {
            $fileName = [IO.Path]::GetFileNameWithoutExtension($clientFile.Name)
            if ($fileName -notmatch '^chaoxing-exam-(?<version>v[0-9.]+)$') {
              throw "无法从客户端文件名识别版本: $($clientFile.Name)"
            }
            $version = $Matches.version
            $injectMode = if ($fileName -match '^chaoxing-exam-v4\.3\.') {
              'dll-proxy'
            } elseif ($fileName -match '^chaoxing-exam-v4\.1\.4\.') {
              'cdp-port'
            } else {
              throw "未定义客户端注入通道: $($clientFile.Name)"
            }
            $relativePath = [IO.Path]::GetRelativePath($env:GITHUB_WORKSPACE, $clientFile.FullName).Replace([IO.Path]::DirectorySeparatorChar, '/')
            foreach ($databaseVar in $databaseVars) {
              [ordered]@{
                client = $version
                installer = $relativePath
                inject_mode = $injectMode
                database = $databaseVar.Suffix
                database_var = $databaseVar.Name
              }
            }
          }
          $matrix = [ordered]@{ include = @($entries) } | ConvertTo-Json -Compress -Depth 5
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "matrix=$matrix`n", [Text.UTF8Encoding]::new($false))
          Write-Host "发现 $($clientFiles.Count) 个客户端、$($databaseVars.Count) 个数据库变量，生成 $($entries.Count) 个注入用例"
          $databaseVars | ForEach-Object { Write-Host "数据库 Base64 变量 $($_.Name) 已发现并掩码" }

  windows-unit:
    name: Windows 单元与原生测试
    needs: windows-build
    if: ${{ needs.windows-build.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CXPLUS_NO_LOG_FILE: '1'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 下载共享 Windows 测试产物
        uses: actions/download-artifact@v4
        with:
          name: windows-ci-build-${{ github.sha }}
          path: .
      - name: 准备 Windows 测试环境
        shell: pwsh
        run: ./scripts/ci/prepare-windows-test-environment.ps1 -RequireBrowsers
      - name: 单元测试（不含浏览器、隔离暂停与可见窗口）
        shell: pwsh
        run: |
          $excluded = @(
            'tab-answer-pause.test.mjs',
            'windows-selection-window.test.mjs',
            'windows-scan-progress-window.test.mjs',
            'windows-native-selection.test.mjs',
            'windows-native-home.test.mjs',
            'windows-native-adapter.test.mjs',
            'windows-native-browser-session.test.mjs'
          )
          # 启动真实 Chromium 的用例挪到浏览器作业串行执行：并发的浏览器与原生用例曾把
          # page.goto / waitForSelector 的默认超时拖爆（相邻两次运行各失败一个用例）。
          $browserDriven = @(Get-ChildItem -LiteralPath scripts -Filter '*.test.mjs' -File |
            Where-Object { $excluded -notcontains $_.Name -and (Select-String -LiteralPath $_.FullName -Pattern 'puppeteer\.launch\(' -Quiet) } |
            Select-Object -ExpandProperty Name)
          Write-Host "移交浏览器作业的用例: $($browserDriven.Count)"
          $testFiles = @(Get-ChildItem -LiteralPath scripts -Filter '*.test.mjs' -File |
            Where-Object { $excluded -notcontains $_.Name -and $browserDriven -notcontains $_.Name } |
            Sort-Object Name | Select-Object -ExpandProperty FullName)
          if ($testFiles.Count -eq 0) { throw '单元测试清单为空' }
          Write-Host "单元测试文件数: $($testFiles.Count)"
          $tapPath = Join-Path $env:RUNNER_TEMP 'ci-unit-tests.tap'
          node --test --test-reporter=tap --test-concurrency=2 --test-timeout=300000 @testFiles 2>&1 | Tee-Object -FilePath $tapPath
          $exitCode = $LASTEXITCODE
          if (-not (Select-String -LiteralPath $tapPath -Pattern '^# skipped (\d+)$' | Select-Object -Last 1)) { throw '单元测试未产生 TAP 汇总' }
          if ($exitCode -ne 0) { exit $exitCode }
      - name: 写入单元测试摘要
        if: always()
        shell: pwsh
        run: |
          "## Windows 单元与原生测试`n`n测试在独立 runner 串行分组执行；完整 TAP 日志位于 runner 临时目录。" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  windows-pause:
    name: Windows 标签页暂停隔离回归
    needs: windows-build
    if: ${{ needs.windows-build.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CXPLUS_NO_LOG_FILE: '1'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 下载共享 Windows 测试产物
        uses: actions/download-artifact@v4
        with:
          name: windows-ci-build-${{ github.sha }}
          path: .
      - name: 准备 Windows 测试环境
        shell: pwsh
        run: ./scripts/ci/prepare-windows-test-environment.ps1 -RequireBrowsers
      - name: 标签页暂停回归（独立 runner）
        shell: pwsh
        run: |
          $testFile = (Resolve-Path -LiteralPath 'scripts/tab-answer-pause.test.mjs').Path
          $tapPath = Join-Path $env:RUNNER_TEMP 'ci-tab-answer-pause.tap'
          node --test --test-reporter=tap --test-concurrency=1 --test-timeout=300000 $testFile 2>&1 | Tee-Object -FilePath $tapPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-window:
    name: Windows 可见窗口与 Edge/Chrome 会话回归
    needs: windows-build
    if: ${{ needs.windows-build.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CXPLUS_NO_LOG_FILE: '1'
      CX_TEST_NATIVE_WINDOW: '1'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 下载共享 Windows 测试产物
        uses: actions/download-artifact@v4
        with:
          name: windows-ci-build-${{ github.sha }}
          path: .
      - name: 准备 Windows 测试环境
        shell: pwsh
        run: ./scripts/ci/prepare-windows-test-environment.ps1 -RequireBrowsers
      - name: 可见窗口与浏览器会话回归（独立 runner）
        shell: pwsh
        run: |
          $files = @(
            'scripts/windows-selection-window.test.mjs',
            'scripts/windows-scan-progress-window.test.mjs',
            'scripts/windows-native-selection.test.mjs',
            'scripts/windows-native-home.test.mjs',
            'scripts/windows-native-adapter.test.mjs',
            'scripts/windows-native-browser-session.test.mjs'
          ) | ForEach-Object { (Resolve-Path -LiteralPath $_).Path }
          if ($files.Count -ne 6) { throw "可见窗口测试清单不完整: $($files.Count)" }
          $tapPath = Join-Path $env:RUNNER_TEMP 'ci-window-tests.tap'
          node --test --test-reporter=tap --test-concurrency=1 --test-timeout=600000 @files 2>&1 | Tee-Object -FilePath $tapPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-browser:
    name: Windows 浏览器回归
    needs: windows-build
    if: ${{ needs.windows-build.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CXPLUS_NO_LOG_FILE: '1'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 下载共享 Windows 测试产物
        uses: actions/download-artifact@v4
        with:
          name: windows-ci-build-${{ github.sha }}
          path: .
      - name: 准备 Windows 测试环境
        shell: pwsh
        run: ./scripts/ci/prepare-windows-test-environment.ps1 -RequireBrowsers
      - name: 浏览器回归（独立 runner）
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath scripts -Filter '*.browser.mjs' -File | Sort-Object Name | Select-Object -ExpandProperty FullName)
          # 单元作业只保留不启动浏览器的用例；这里按实际是否调用 puppeteer.launch 收集，避免漏测。
          $handledElsewhere = @(
            'tab-answer-pause.test.mjs',
            'windows-selection-window.test.mjs',
            'windows-scan-progress-window.test.mjs',
            'windows-native-selection.test.mjs',
            'windows-native-home.test.mjs',
            'windows-native-adapter.test.mjs',
            'windows-native-browser-session.test.mjs'
          )
          $files += @(Get-ChildItem -LiteralPath scripts -Filter '*.test.mjs' -File |
            Where-Object { $handledElsewhere -notcontains $_.Name -and (Select-String -LiteralPath $_.FullName -Pattern 'puppeteer\.launch\(' -Quiet) } |
            Sort-Object Name | Select-Object -ExpandProperty FullName)
          if ($files.Count -eq 0) { throw '浏览器测试清单为空' }
          Write-Host "浏览器测试文件数: $($files.Count)"
          $tapPath = Join-Path $env:RUNNER_TEMP 'ci-browser-tests.tap'
          node --test --test-reporter=tap --test-concurrency=1 --test-timeout=600000 @files 2>&1 | Tee-Object -FilePath $tapPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-release:
    name: Windows 发布包验证
    needs: [windows-build, windows-unit, windows-pause, windows-window, windows-browser]
    if: ${{ always() && needs.windows-build.result == 'success' && needs.windows-unit.result == 'success' && needs.windows-pause.result == 'success' && needs.windows-window.result == 'success' && needs.windows-browser.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      release-artifact-url: ${{ steps.upload_release.outputs.artifact-url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 下载共享 Windows 构建产物
        uses: actions/download-artifact@v4
        with:
          name: windows-ci-build-${{ github.sha }}
          path: .
      - name: 构建发布包
        run: npm run release:windows
      - name: 发布目录 Node 入口回归
        run: node --test --test-concurrency=1 --test-timeout=180000 scripts/windows-node-exe.test.mjs
      - name: 发布目录复制后入口自检
        shell: pwsh
        run: |
          $build = (Resolve-Path 'windows/native-build').Path
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (Test-Path -LiteralPath (Join-Path $build "chaoxing-plus-$version-windows.zip")) { throw '原生发布不应生成 ZIP' }
          $copied = Join-Path $build ('release-ci\' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $copied -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $build 'release') -Destination $copied -Recurse
          $package = Join-Path $copied 'release'
          node (Join-Path $package 'verify-release.mjs')
          if ($LASTEXITCODE -ne 0) { throw "发布包完整性自校验失败: $LASTEXITCODE" }
          foreach ($required in @('release-info.json', 'SHA256SUMS.txt', 'verify-release.mjs', 'single-file\chaoxing_plus.exe', 'multi-file\start-windows.cmd', 'multi-file\windows\share-file\config.example.json', 'multi-file\chaoxing_plus.exe', 'multi-file\chaoxing_plus.com', 'multi-file\assets\windows-bootstrap.js', 'multi-file\assets\chaoxing-plus.windows.js', 'multi-file\assets\trampoline.js', 'multi-file\assets\vendor\sweetalert2.min.css', 'multi-file\winmm-proxy.dll', 'multi-file\package-to-single\chaoxing_plus.exe', 'multi-file\release-info.json', 'multi-file\SHA256SUMS.txt', 'multi-file\verify-release.mjs')) {
            if (-not (Test-Path -LiteralPath (Join-Path $package $required))) { throw "发布包缺少: $required" }
          }
          foreach ($forbidden in @('multi-file\README.md', 'multi-file\docs', 'chaoxing_plus.exe', 'start-windows.cmd', 'windows\node-source\main.mjs', 'start-windows-node.cmd', 'runtime\node.exe')) {
            if (Test-Path -LiteralPath (Join-Path $package $forbidden)) { throw "原生发布包不应包含 Node 产物: $forbidden" }
          }
          $native = Start-Process -FilePath (Join-Path $package 'single-file\chaoxing_plus.exe') -ArgumentList '--self-check','--quiet','--no-disk-write' -PassThru -Wait
          if ($native.ExitCode -ne 0) { throw "发布包原生自检失败: $($native.ExitCode)" }
          node (Join-Path $package 'multi-file\verify-release.mjs')
          if ($LASTEXITCODE -ne 0) { throw "多文件变体完整性自校验失败: $LASTEXITCODE" }
          $multi = Start-Process -FilePath (Join-Path $package 'multi-file\chaoxing_plus.exe') -ArgumentList '--self-check','--quiet','--no-disk-write' -PassThru -Wait
          if ($multi.ExitCode -ne 0) { throw "多文件变体原生自检失败: $($multi.ExitCode)" }
          Push-Location -LiteralPath (Join-Path $package 'multi-file')
          try {
            $resolved = @(Get-Command .\chaoxing_plus -CommandType Application)[0].Source
            if ([IO.Path]::GetExtension($resolved) -ne '.com') { throw "扩展名省略入口未选择 .com: $resolved" }
            .\chaoxing_plus --self-check --quiet --no-disk-write
            if ($LASTEXITCODE -ne 0) { throw "控制台辅助入口自检失败: $LASTEXITCODE" }
          } finally { Pop-Location }
          $wrapper = Start-Process -FilePath (Join-Path $package 'multi-file\package-to-single\chaoxing_plus.exe') -ArgumentList '--self-check','--quiet','--no-disk-write' -PassThru -Wait
          if ($wrapper.ExitCode -ne 0) { throw "多文件单 EXE 包装器自检失败: $($wrapper.ExitCode)" }
      - name: 上传 Windows 发布包
        id: upload_release
        uses: actions/upload-artifact@v4
        with:
          name: Windows 发布包
          path: windows/native-build/release/
          if-no-files-found: error

  windows-real-client:
    name: 真实客户端注入 ${{ matrix.client }} / 数据库 ${{ matrix.database }}
    permissions:
      contents: read
    needs: [windows-build, windows-real-client-discovery]
    if: ${{ needs.windows-build.result == 'success' && needs.windows-real-client-discovery.result == 'success' && github.event_name != 'pull_request' }}
    # Point this at a machine that can satisfy the client's environment check (camera + zh-CN input
    # method) by setting the repository variable REAL_CLIENT_RUNNER, e.g.
    #   ["self-hosted","windows","cx-exam"]
    # The default hosted runner has no zh-CN language payload and no camera, so the client refuses to
    # enter the exam there and the run reports BLOCKED instead of FAILED.
    runs-on: ${{ fromJSON(vars.REAL_CLIENT_RUNNER || '"windows-latest"') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.windows-real-client-discovery.outputs.matrix) }}
    steps:
      - name: 检出代码与 Git LFS 客户端资产
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: 下载共享 Windows 构建产物
        uses: actions/download-artifact@v4
        with:
          name: windows-ci-build-${{ github.sha }}
          path: .
      - name: 校验私有客户端资产
        shell: pwsh
        run: |
          $path = '${{ matrix.installer }}'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Git LFS 客户端资产缺失: $path" }
          $size = (Get-Item -LiteralPath $path).Length
          if ($size -lt 100MB) { throw "客户端资产大小异常: $size bytes" }
      - name: 确保 7-Zip 可用
        shell: pwsh
        run: |
          if (-not (Get-Command 7z.exe -ErrorAction SilentlyContinue) -and -not (Test-Path -LiteralPath (Join-Path $env:ProgramFiles '7-Zip\7z.exe'))) {
            choco install 7zip --no-progress -y
          }
      - name: 准备桌面环境（分辨率 / 输入法 / 虚拟摄像头）
        shell: pwsh
        continue-on-error: true
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'cx-real-client-prep.log'
          ./scripts/ci/prepare-windows-real-client-environment.ps1 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { Write-Host "desktop preparation exited $LASTEXITCODE; the injection report still decides the result" }
      - name: 执行真实客户端注入
        shell: pwsh
        env:
          DATABASE_VARIABLE_NAME: ${{ matrix.database_var }}
          DATABASE_BASE64: ${{ vars[matrix.database_var] }}
        run: |
          if ($env:DATABASE_VARIABLE_NAME -notmatch '^Examination_Client_Database_.+$') {
            throw "数据库变量名格式错误: $env:DATABASE_VARIABLE_NAME"
          }
          $db = [string]$env:DATABASE_BASE64
          if ([string]::IsNullOrWhiteSpace($db)) { throw "数据库 Base64 变量为空: $env:DATABASE_VARIABLE_NAME" }
          $compactDb = $db -replace '\s', ''
          if ([string]::IsNullOrWhiteSpace($compactDb)) { throw "数据库 Base64 变量为空: $env:DATABASE_VARIABLE_NAME" }
          if (($compactDb.Length % 4) -ne 0 -or $compactDb -notmatch '^[A-Za-z0-9+/]+={0,2}$') {
            throw "变量 $env:DATABASE_VARIABLE_NAME 必须是 UserExamInfo.db 的 Base64 文本；不再接受 enabled 标记或 ZIP 载荷"
          }
          Write-Output "::add-mask::$compactDb"
          Write-Host "读取数据库变量 $env:DATABASE_VARIABLE_NAME（Base64 $($compactDb.Length) 字符，已掩码），解码为 UserExamInfo.db 并写入 CXExam.exe 同目录"
          ./scripts/windows-real-client-injection.ps1 `
            -ClientInstaller (Resolve-Path '${{ matrix.installer }}').Path `
            -InjectMode '${{ matrix.inject_mode }}' `
            -DatabaseBase64 $compactDb `
            -NativeHost (Resolve-Path 'windows/native-build/bin/chaoxing_plus.exe').Path `
            -CaseName '${{ matrix.client }}-${{ matrix.database }}' `
            -AllowEnvironmentBlocked
      - name: 上传注入现场（成功与失败都保留）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-client-${{ matrix.client }}-${{ matrix.database }}
          # Store the files as-is: artifact packaging must not run another compression pass over the
          # PNG frames (level 0 keeps the bytes identical to what the runner wrote).
          compression-level: 0
          path: |
            ${{ runner.temp }}/cx-real-client-*.png
            ${{ runner.temp }}/cx-real-client-*.json
            ${{ runner.temp }}/cx-real-client-*.log
          if-no-files-found: warn
          retention-days: 7

  summary:
    name: 持续集成汇总
    runs-on: ubuntu-24.04
    needs: [source, windows-build, windows-unit, windows-pause, windows-window, windows-browser, windows-release, windows-real-client-discovery, windows-real-client]
    if: always()
    steps:
      - name: 输出各环境结果与发布产物
        shell: bash
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          WINDOWS_BUILD_RESULT: ${{ needs.windows-build.result }}
          WINDOWS_UNIT_RESULT: ${{ needs.windows-unit.result }}
          WINDOWS_PAUSE_RESULT: ${{ needs.windows-pause.result }}
          WINDOWS_WINDOW_RESULT: ${{ needs.windows-window.result }}
          WINDOWS_BROWSER_RESULT: ${{ needs.windows-browser.result }}
          WINDOWS_RELEASE_RESULT: ${{ needs.windows-release.result }}
          WINDOWS_REAL_CLIENT_DISCOVERY_RESULT: ${{ needs.windows-real-client-discovery.result }}
          WINDOWS_REAL_CLIENT_RESULT: ${{ needs.windows-real-client.result }}
          RELEASE_ARTIFACT_URL: ${{ needs.windows-release.outputs.release-artifact-url }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          result_label() {
            case "$1" in
              success) echo '通过' ;;
              failure) echo '失败' ;;
              cancelled) echo '已取消' ;;
              skipped) echo '已跳过' ;;
              *) echo '未执行' ;;
            esac
          }
          {
            echo '## 持续集成结果'
            echo
            echo '| 验证环境 | 结果 |'
            echo '| --- | --- |'
            printf '| Ubuntu 类型检查与扩展构建 | %s |\n' "$(result_label "$SOURCE_RESULT")"
            printf '| Windows 构建共享产物 | %s |\n' "$(result_label "$WINDOWS_BUILD_RESULT")"
            printf '| Windows 单元与原生测试 | %s |\n' "$(result_label "$WINDOWS_UNIT_RESULT")"
            printf '| Windows 标签页暂停隔离回归 | %s |\n' "$(result_label "$WINDOWS_PAUSE_RESULT")"
            printf '| Windows 可见窗口与浏览器会话 | %s |\n' "$(result_label "$WINDOWS_WINDOW_RESULT")"
            printf '| Windows 浏览器回归 | %s |\n' "$(result_label "$WINDOWS_BROWSER_RESULT")"
            printf '| Windows 发布包验证 | %s |\n' "$(result_label "$WINDOWS_RELEASE_RESULT")"
            printf '| 真实客户端矩阵发现 | %s |\n' "$(result_label "$WINDOWS_REAL_CLIENT_DISCOVERY_RESULT")"
            printf '| 真实客户端自动发现注入矩阵 | %s |\n' "$(result_label "$WINDOWS_REAL_CLIENT_RESULT")"
            echo
            if [[ -n "$RELEASE_ARTIFACT_URL" ]]; then
              printf '[下载 Windows 发布包](%s)\n' "$RELEASE_ARTIFACT_URL"
            else
              echo 'Windows 发布包未生成或上传失败。'
            fi
            echo
            printf '代码提交：`%s`\n' "$COMMIT_SHA"
            printf '\n[查看完整运行日志](%s)\n' "$RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
